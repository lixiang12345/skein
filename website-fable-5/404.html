  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      var theme = null, language = null;
      try {
        theme = window.localStorage.getItem("skein-theme");
        language = window.localStorage.getItem("skein-lang");
      } catch (error) { theme = null; language = null; }
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      if (language !== "en" && language !== "zh-CN") {
        language = ((navigator.language || "").toLowerCase().indexOf("zh") === 0) ? "zh-CN" : "en";
      }
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
      root.setAttribute("lang", language);
      document.addEventListener("DOMContentLoaded", function () {
        var titled = root.getAttribute(language === "zh-CN" ? "data-title-zh" : "data-title-en");
        if (titled) document.title = titled;
      });
    })();
  </script>
</head>
