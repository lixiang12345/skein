# When this file is placed under a repository's .mosaic directory, hooks,
# permissions, verification commands, checkpoint overrides, custom context,
# LSP, and background executables require --trust-project-config. User-level
# config is trusted.
model:
  provider: openai
  model: gpt-5
  temperature: 0.2
  maxTokens: 8192

context:
  # Model prompt window; independent from the retrieval budget below.
  windowTokens: 500000
  maxTokens: 12000
  topK: 12

permissions:
  read: allow
  write: ask
  shell: ask
  git: ask
  network: ask
  allowCommands:
    - git status
    - git diff
    - git log
    - npm test
    - npm run typecheck
    - npm run build
  denyCommands:
    - rm -rf /
    - git reset --hard
    - git clean -fd
    - git checkout --
    - sudo

agent:
  maxTurns: 24
  maxEpochTokens: 500000
  maxSessionTokens: 1000000
  autoVerify: true
  verifyCommands:
    - npm run typecheck
    - npm test
  checkpointBeforeWrite: true

agents:
  enabled: true
  # Enable only in user-owned or explicitly trusted project configuration.
  writerEnabled: false
  writerProfile: implementer
  writerReviewerProfile: reviewer
  maxWriterPatchBytes: 60000

hooks:
  beforeTool: []
  afterTool: []
  afterTurn: []

ui:
  color: true
  compact: false
  theme: auto

# Optional local stdio language servers. Keep disabled in committed project
# config unless the repository and exact executable settings were reviewed.
lsp:
  enabled: false
  timeoutMs: 5000
  servers:
    typescript:
      command: typescript-language-server
      args: [--stdio]
      extensions: [.ts, .tsx]
      languageId: typescript

# Optional durable local commands. Each model-initiated start/kill remains a
# live-human action and background mutations never become completion evidence.
backgroundJobs:
  enabled: false
  maxConcurrent: 2
  maxJobsPerSession: 16
  maxLogBytes: 2000000
  maxRuntimeMs: 1800000

# External capabilities are disabled until both configuration and the separate
# workspace-bound manifest trust review are explicit. Use:
#   skein mcp search docs
#   skein mcp inspect docs
#   skein mcp trust docs
#   skein mcp activate docs search documentation
mcp:
  enabled: false
  connectTimeoutMs: 12000
  toolTimeoutMs: 60000
  servers:
    docs:
      enabled: false
      required: false
      transport: http
      url: https://docs.example.com/mcp
      description: Search approved documentation.
      version: 1.0.0
      tools:
        - name: search
          description: Search the approved documentation corpus.
          permissions: [read]
          network: [https://docs.example.com]
          commands: []
          paths: []
          sensitiveFields: [token]
          background: false
          processTree: false
          completionEvidence: none
